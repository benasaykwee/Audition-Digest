name: Audition Digest

on:
  schedule:
    # 12:00 UTC every Sunday = 8am Eastern (Daylight Time) / 7am Eastern (Standard Time).
    # GitHub's cron is always UTC and doesn't shift for daylight saving,
    # so the actual local delivery time drifts by an hour twice a year.
    - cron: "0 12 * * 0"
  workflow_dispatch: {}   # adds a "Run workflow" button in the Actions tab, for manual test runs

permissions:
  contents: write   # needed so the job can commit the updated pick-list page

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_RECIPIENT: ${{ secrets.GMAIL_RECIPIENT }}
        run: python digest.py

      - name: Publish this week's pick-list page
        run: |
          git config user.name "audition-digest-bot"
          git config user.email "actions@github.com"
          git add docs/index.html
          git diff --staged --quiet && echo "No changes to the page, skipping commit" || git commit -m "Update pick-list page"
          git push

      - name: Build digest.json for Quest Board
        run: python build_digest_json.py

      - name: Push digest.json to Quest Board
        env:
          QUEST_BOARD_TOKEN: ${{ secrets.QUEST_BOARD_TOKEN }}
        run: |
          if [ -z "$QUEST_BOARD_TOKEN" ]; then
            echo "QUEST_BOARD_TOKEN secret not set yet — skipping Quest Board digest update."
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${QUEST_BOARD_TOKEN}@github.com/benasaykwee/quest-board.git" qb
          cp digest-out.json qb/public/digest.json
          cd qb
          git config user.name "audition-digest-bot"
          git config user.email "actions@github.com"
          git add public/digest.json
          git diff --staged --quiet && echo "Digest unchanged, skipping commit" || (git commit -m "Auto-update digest.json" && git push)
